name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # Full-repo check as of Zyklus 3 (chore/ruff-legacy-cleanup): all pre-existing
      # findings except E501 (line-too-long) were fixed or annotated. E501 remains
      # ignored repo-wide until Zyklus 4 does the line-length reflow. src/security/
      # is excluded because that path is AI-edit-locked (see CLAUDE.md, .claude/
      # settings.json permissions.deny) -- its handful of remaining findings need a
      # manual pass by a human maintainer. Once both are cleared, drop --ignore E501
      # and --exclude src/security to get the full, unscoped `ruff check .`.
      - name: Ruff
        shell: bash
        run: ruff check . --exclude src/security --ignore E501

      - name: Pytest
        run: pytest -q
