name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # Full-repo check, E501 included as of Zyklus 5 (chore/e501-reflow): the repo
      # was reflowed with `ruff format` and now passes the full rule set. src/security/
      # remains excluded because that path is AI-edit-locked (see CLAUDE.md, .claude/
      # settings.json permissions.deny) -- its handful of remaining findings need a
      # manual pass by a human maintainer. Once cleared, drop --exclude src/security
      # to get the full, unscoped `ruff check .`.
      - name: Ruff
        shell: bash
        run: ruff check . --exclude src/security

      - name: Pytest
        run: pytest -q
