name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # Ruff only runs against files touched by this change. The repo carries
      # pre-existing lint debt (~780 findings, mostly line-length, unrelated to
      # any single change) that is out of scope to fix in one pass. Scoping to
      # the diff enforces the standard on new/changed code without blocking on
      # legacy files. See CLAUDE.md "Open Issues" for the tracked cleanup.
      - name: Determine changed Python files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            FILES=""
          else
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" -- '*.py' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Ruff (changed files only)
        if: steps.changed.outputs.files != ''
        shell: bash
        run: ruff check ${{ steps.changed.outputs.files }}

      - name: Pytest
        run: pytest -q
